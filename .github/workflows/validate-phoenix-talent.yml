name: Validate ADM Phoenix Talent
on:
  push:
    branches: [main, feat/phoenix-talent-rh, feat/jarvis-executive-report-3-1, feat/jarvis-status-thinking-3-2, feat/jarvis-audio-interview-3-5]
  pull_request:
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate module and ADM integration
        run: |
          node --check talent_module.js
          node tests/talent-integration.test.cjs
          node tests/jarvis-pdf-smoke.cjs
          node tests/jarvis-status.test.cjs
          node tests/jarvis-role-review.test.cjs
          node tests/jarvis-audio-ui.test.cjs
