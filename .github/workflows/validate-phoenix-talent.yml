name: Validate ADM Phoenix Talent
on:
  push:
    branches: [main, feat/phoenix-talent-rh]
  pull_request:
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate module and ADM integration
        run: |
          node --check talent_module.js
          node tests/talent-integration.test.cjs
